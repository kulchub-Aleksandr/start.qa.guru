plugins {  // плагины сборки
    id 'java-library'
    id 'io.qameta.allure' version '4.3.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)  // версия JDK — пин SSOT
    }
}

repositories {  // откуда тянуть зависимости
    mavenCentral()
}

allure {  // конфиг allure-плагина: версия и авто-адаптер
    version = '3.14.3'
    adapter {
        allureJavaVersion = '3.0.0'
        autoconfigure = true
        aspectjWeaver = true
        frameworks {
            junit5 {
                enabled = true
            }
        }
    }
}

dependencies {  // тестовые зависимости
    testImplementation(
            platform("io.qameta.allure:allure-bom:3.0.0"),
            "com.codeborne:selenide:7.19.0",
            "org.seleniumhq.selenium:selenium-java:4.52.0",
            "org.junit.jupiter:junit-jupiter:6.1.3",
            "io.qameta.allure:allure-jupiter",
            "io.qameta.allure:allure-selenide")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'  // исходники в UTF-8
}

test {  // таск прогона: раннер, агент, логи, отчёты
    useJUnitPlatform()  // раннер JUnit Platform
    testLogging.showStandardStreams = true  // stdout тестов в консоль — маркер сессии фермы
    reports.html.required = true  // явная настройка HTML-отчёта
    reports.junitXml.required = true
}
